<!DOCTYPE html>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matheo Template</title>
    <link rel="stylesheet" href="matheoStyles.css">

    <!-- reuse this in every page -->
    <script>
        (function () {
            const saved = localStorage.getItem("theme");

            if (saved === "dark") {
                document.documentElement.classList.add("darkmode");
            } else if (saved === "light") {
                document.documentElement.classList.remove("darkmode");
            } else {
                // Optional: system preference fallback
                const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
                if (prefersDark) {
                    document.documentElement.classList.add("darkmode");
                }
            }
        })();
    </script>

    <!-- utility, save this in main folder -->
    <script type="text/javascript" src="/sharedResources/theme/theme.js" defer></script>
</head>
